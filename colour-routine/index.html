<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2efe8">
  <title>Colour Routine — Same rules. Different outcomes.</title>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    :root{color-scheme:light;--paper:#f2efe8;--ink:#23231f;--muted:#77766f;--line:#d8d4ca;--accent:#b74432;--card:#f8f6f0}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Arial,Helvetica,sans-serif}
    .shell{width:min(1120px,calc(100% - 48px));margin:auto}header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}.brand span{color:var(--accent)}nav{display:flex;gap:24px;align-items:center}nav a{color:var(--muted);text-decoration:none;font-size:.82rem}nav a:hover,nav a[aria-current=page]{color:var(--ink)}
    main{padding:clamp(72px,13vh,150px) 0 100px}.eyebrow,.label{font: .7rem/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    h1{font-size:clamp(3.1rem,9vw,7rem);line-height:.95;letter-spacing:-.075em;font-weight:500;max-width:850px;margin:24px 0}.tagline{font-size:clamp(1.1rem,2vw,1.5rem);color:var(--muted);margin:0 0 64px}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.action{min-height:190px;padding:22px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,border-color .2s}.action:hover{transform:translateY(-3px);border-color:var(--ink)}
    .action small{font: .7rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}.action strong{font-size:1.3rem;font-weight:500}.arrow{align-self:flex-end;color:var(--accent);font-size:1.25rem}footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:.72rem}
    @media(max-width:700px){.shell{width:min(100% - 32px,560px)}header{height:auto;min-height:70px;align-items:flex-start;padding:20px 0;gap:16px;flex-direction:column}nav{gap:16px;flex-wrap:wrap}.actions{grid-template-columns:1fr}.action{min-height:135px}main{padding-top:72px}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="index.html" style="color:inherit;text-decoration:none"><span>◉</span> Colour Routine</a><nav aria-label="Main navigation"><a href="about.html">About</a><a href="mint.html">Mint</a><a href="gallery.html">Gallery</a><button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle colour theme">Dark mode</button></nav></header>
    <main>
      <div class="eyebrow">An on-chain generative art project</div>
      <h1>Colour<br>Routine</h1>
      <p class="tagline">Same rules. Different outcomes.</p>
      <section class="actions" aria-label="Explore Colour Routine">
        <a class="action" href="about.html"><small>01 / THE IDEA</small><strong>What is Colour Routine?</strong><span class="arrow">↗</span></a>
        <a class="action" href="mint.html"><small>02 / TAKE PART</small><strong>Mint a work</strong><span class="arrow">↗</span></a>
        <a class="action" href="gallery.html"><small>03 / THE COLLECTION</small><strong>Explore the gallery</strong><span class="arrow">↗</span></a>
      </section>
    </main>
    <footer>Colour Routine · Generative art on Tezos</footer>
  </div>
</body>
</html>
